; Sophi's ESP32 firmware: the hand controls (env hand), the obstacle sensors (env tof) and the lift (env lift),
; plus the native tests (env native). One hand board has run via an Arduino CLI build; CI builds the hand and
; obstacle boards and runs native tests. The lift firmware has not run on hardware.
;
; Each board's module id is set when it is built or flashed, and the build stops if it is missing or "any":
;   WALKER_MODULE_ID=hand-left-01  pio run -e hand -t upload
;   WALKER_MODULE_ID=hand-right-01 pio run -e hand -t upload
;   WALKER_MODULE_ID=tof-front-01  pio run -e tof  -t upload
;   WALKER_MODULE_ID=lift-01       pio run -e lift -t upload
; See README.md for wiring and flashing.
;
; Versions are pinned; publication dates were normalized to 2026-10-23 and have not been reverified, except Unity (test_framework),
; which PlatformIO picks itself (throwtheswitch/Unity@^2.6.1; 2.6.1 when tested).

[platformio]
default_envs = hand, tof

[board]
; espressif32 6.12.0 bundles the Arduino-ESP32 core 2.0.17 (date label normalized to 2026-10-23).
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; The core builds C++ as gnu++11; the shared code needs C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Only the board's own sources see the id, so changing it rebuilds one file, not the whole core. The single
; quotes are PlatformIO's documented way to pass a string ("Stringification" under build_flags).
build_src_flags =
  -Wall
  -Wextra
  '-D WALKER_MODULE_ID="${sysenv.WALKER_MODULE_ID}"'

[env:hand]
extends = board
build_src_filter = +<hand/>

[env:tof]
extends = board
build_src_filter = +<tof/>
lib_deps =
  pololu/VL53L1X@1.3.1

[env:lift]
; The TB6600 settings (microsteps, enable polarity, direction) are build flags; see README.md, "Lift board".
; FastAccelStepper 1.2.8 has a normalized date label of 2026-10-23; its publication date is not reverified.
extends = board
build_src_filter = +<lift/>
build_src_flags =
  ${board.build_src_flags}
  -D WALKER_LIFT_MICROSTEPS=8
  -D WALKER_LIFT_ENA_ENABLE_LEVEL=0
  -D WALKER_LIFT_DIR_UP_LEVEL=1
lib_deps =
  gin66/FastAccelStepper@1.2.8

[env:native]
; Host tests: pio test -e native. They build lib/ and test/ with the computer's compiler.
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
