# Installed as /etc/systemd/journald.conf.d/90-walker-persistent.conf. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (Storage=volatile), which keeps logs in
# memory only, so they vanish at every power-off. This file is read after it and wins, so logs are kept on
# the SD card and the walker's log from before a crash or power loss can still be read (`journalctl -b -1`).
[Journal]
Storage=persistent
