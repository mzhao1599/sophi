# Installed as /etc/systemd/system/steady-walker.service.d/10-volume.conf. Sets our soundbar to 75% volume
# each time the walker service starts: its mixer control is "PCM", and it came up at 30%. Max asked for
# full volume, then 75% (2026-10-23); checked on the Pi 5 after a restart. The leading "-" means a missing card (soundbar unplugged, or a
# speaker whose control isn't called PCM: see `amixer -c <card> scontrols`) doesn't stop the service.
[Service]
ExecStartPre=-/usr/bin/amixer -q -c Speaker sset PCM 75% unmute
