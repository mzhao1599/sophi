# Installed as /etc/systemd/system/steady-walker.service.d/10-volume.conf. Sets our soundbar to full volume
# each time the walker service starts: its mixer control is "PCM", and it came up at 30%. Checked on the
# Pi 5 on 2026-10-24: 100% after a restart. The leading "-" means a missing card (soundbar unplugged, or a
# speaker whose control isn't called PCM: see `amixer -c <card> scontrols`) doesn't stop the service.
[Service]
ExecStartPre=-/usr/bin/amixer -q -c Speaker sset PCM 100% unmute
