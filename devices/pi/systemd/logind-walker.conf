# Installed as /etc/systemd/logind.conf.d/90-walker-power-key.conf. One short press of the Pi 5's power
# button normally shuts it down cleanly; on 2026-10-24 that happened twice by accident while the board was
# being handled. For the demo a short press does nothing. Holding the button about 10 s still forces the Pi
# off. Delete this file (then `sudo systemctl kill -s HUP systemd-logind`) to get the short press back.
[Login]
HandlePowerKey=ignore
