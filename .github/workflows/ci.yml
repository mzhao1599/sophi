name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version input: the action installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ESP32 firmware (firmware/). The board builds prove the code compiles against the pinned platform and
  # libraries; nothing in CI runs on an ESP32.
  firmware:
    name: Firmware tests and board builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      # Unit tests with sanitizers, the provisioning guards, and the session transcript the contract's
      # cross-check reads (packages/contracts/test/firmware-session.test.ts, run by the check job).
      - name: Native checks with the system compiler
        run: test/run-native.sh

      - name: Native tests under PlatformIO
        run: pio test -e native

      - name: Build the hand board
        run: WALKER_MODULE_ID=hand-left-01 pio run -e hand

      - name: Build the obstacle board
        run: WALKER_MODULE_ID=tof-front-01 pio run -e tof

      - name: Build the lift board
        run: WALKER_MODULE_ID=lift-01 pio run -e lift

      - name: A board provisioned as "any" must not build
        run: |
          if WALKER_MODULE_ID=any pio run -e hand >any.log 2>&1; then
            echo "The hand board built with WALKER_MODULE_ID=any."
            exit 1
          fi
          grep -q "WALKER_MODULE_ID must" any.log
